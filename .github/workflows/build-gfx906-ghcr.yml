name: Build GFX906 image to GHCR

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push final image to GHCR"
        required: true
        type: boolean
        default: true
      image_name:
        description: "Image name under ghcr.io/<owner>/"
        required: true
        type: string
        default: "vllm-gfx906-mobydick"
      image_tag:
        description: "Optional explicit tag (empty = auto)"
        required: false
        type: string
        default: ""
      base_rocm_image:
        description: "Base ROCm dev image"
        required: true
        type: string
        default: "rocm/dev-ubuntu-24.04:6.3.4-complete"
      pytorch_branch:
        description: "PyTorch git tag/branch"
        required: true
        type: string
        default: "v2.10.0"
      triton_repo:
        description: "Triton repo URL"
        required: true
        type: string
        default: "https://github.com/ai-infos/triton-gfx906.git"
      triton_branch:
        description: "Triton git tag/branch"
        required: true
        type: string
        default: "v3.6.0+gfx906"
      vllm_repo:
        description: "vLLM repo URL"
        required: true
        type: string
        default: "https://github.com/ai-infos/vllm-gfx906-mobydick.git"
      vllm_branch:
        description: "vLLM git tag/branch"
        required: true
        type: string
        default: "main"
      max_jobs:
        description: "MAX_JOBS for PyTorch build (empty = nproc)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - feat/ml-style-dockerfile
    paths:
      - "vllm.Dockerfile"
      - ".github/workflows/build-gfx906-ghcr.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-gfx906-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.vars.outputs.image_ref }}
      push_image: ${{ steps.vars.outputs.push_image }}
      tags: ${{ steps.vars.outputs.tags }}
      base_rocm_image: ${{ steps.vars.outputs.base_rocm_image }}
      pytorch_branch: ${{ steps.vars.outputs.pytorch_branch }}
      triton_repo: ${{ steps.vars.outputs.triton_repo }}
      triton_branch: ${{ steps.vars.outputs.triton_branch }}
      vllm_repo: ${{ steps.vars.outputs.vllm_repo }}
      vllm_branch: ${{ steps.vars.outputs.vllm_branch }}
      max_jobs: ${{ steps.vars.outputs.max_jobs }}
    steps:
      - name: Compute variables
        id: vars
        shell: bash
        run: |
          IMAGE_NAME="${{ inputs.image_name || 'vllm-gfx906-mobydick' }}"
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::12}"
          REF_NAME="${GITHUB_REF_NAME//\//-}"

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            PRIMARY_TAG="${{ inputs.image_tag }}"
          else
            PRIMARY_TAG="${REF_NAME}-${SHORT_SHA}"
          fi

          {
            echo "image_ref=${IMAGE_REF}"
            echo "push_image=${{ inputs.push_image != false }}"
            echo "base_rocm_image=${{ inputs.base_rocm_image || 'rocm/dev-ubuntu-24.04:6.3.4-complete' }}"
            echo "pytorch_branch=${{ inputs.pytorch_branch || 'v2.10.0' }}"
            echo "triton_repo=${{ inputs.triton_repo || 'https://github.com/ai-infos/triton-gfx906.git' }}"
            echo "triton_branch=${{ inputs.triton_branch || 'v3.6.0+gfx906' }}"
            echo "vllm_repo=${{ inputs.vllm_repo || 'https://github.com/ai-infos/vllm-gfx906-mobydick.git' }}"
            echo "vllm_branch=${{ inputs.vllm_branch || 'main' }}"
            echo "max_jobs=${{ inputs.max_jobs || '' }}"
            echo "tags<<EOF"
            echo "${IMAGE_REF}:${PRIMARY_TAG}"
            echo "${IMAGE_REF}:sha-${SHORT_SHA}"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "${IMAGE_REF}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build-torch-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm cache for build_torch target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vllm.Dockerfile
          target: build_torch
          push: false
          build-args: |
            BASE_ROCM_IMAGE=${{ needs.prepare.outputs.base_rocm_image }}
            PYTORCH_BRANCH=${{ needs.prepare.outputs.pytorch_branch }}
            MAX_JOBS=${{ needs.prepare.outputs.max_jobs }}
          cache-from: |
            type=gha,scope=vllm-gfx906-torch
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-torch
          cache-to: |
            type=gha,mode=max,scope=vllm-gfx906-torch
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-torch,mode=max

  build-triton-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm cache for build_triton target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vllm.Dockerfile
          target: build_triton
          push: false
          build-args: |
            BASE_ROCM_IMAGE=${{ needs.prepare.outputs.base_rocm_image }}
            TRITON_REPO=${{ needs.prepare.outputs.triton_repo }}
            TRITON_BRANCH=${{ needs.prepare.outputs.triton_branch }}
          cache-from: |
            type=gha,scope=vllm-gfx906-triton
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-triton
          cache-to: |
            type=gha,mode=max,scope=vllm-gfx906-triton
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-triton,mode=max

  build-and-push-final:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    needs:
      - prepare
      - build-torch-cache
      - build-triton-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build final image and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vllm.Dockerfile
          target: final
          push: ${{ needs.prepare.outputs.push_image == 'true' }}
          tags: ${{ needs.prepare.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          build-args: |
            BASE_ROCM_IMAGE=${{ needs.prepare.outputs.base_rocm_image }}
            PYTORCH_BRANCH=${{ needs.prepare.outputs.pytorch_branch }}
            TRITON_REPO=${{ needs.prepare.outputs.triton_repo }}
            TRITON_BRANCH=${{ needs.prepare.outputs.triton_branch }}
            VLLM_REPO=${{ needs.prepare.outputs.vllm_repo }}
            VLLM_BRANCH=${{ needs.prepare.outputs.vllm_branch }}
            MAX_JOBS=${{ needs.prepare.outputs.max_jobs }}
          cache-from: |
            type=gha,scope=vllm-gfx906-torch
            type=gha,scope=vllm-gfx906-triton
            type=gha,scope=vllm-gfx906-final
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-torch
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-triton
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-final
          cache-to: |
            type=gha,mode=max,scope=vllm-gfx906-final
            type=registry,ref=${{ needs.prepare.outputs.image_ref }}:cache-final,mode=max

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - prepare
      - build-and-push-final
    if: ${{ needs.prepare.outputs.push_image == 'true' }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test import of torch and vllm
        shell: bash
        run: |
          IMAGE="$(echo "${{ needs.prepare.outputs.tags }}" | head -n 1)"
          echo "Testing image: ${IMAGE}"
          docker pull "${IMAGE}"
          docker run --rm --entrypoint python "${IMAGE}" -c "import torch, vllm; print('torch', torch.__version__); print('vllm import ok')"
